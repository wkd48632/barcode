<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      svg {
        display: flex;
      }
      /* 바코드가 그려진 svg만 클릭할 수 있다는 표시 */
      svg:not(:empty) {
        cursor: pointer;
      }
      /* 인쇄할 때는 클릭한 svg(.printing)만 남기고 나머지(textarea, 다른 svg)는 숨긴다.
         .printing이 없을 때(Ctrl+P 등으로 직접 인쇄)는 평소처럼 전체가 인쇄된다. */
      @media print {
        body:has(.printing) > *:not(.printing) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <textarea id="lines"></textarea>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script>
      const COUNT = 300;
      const SVG_NS = 'http://www.w3.org/2000/svg';
      const BARCODE_OPTIONS = {
        format: 'CODE128',
        width: 2,
        height: 80,
        displayValue: true
      };

      const textarea = document.getElementById('lines');
      const svgs = [];      // svgs[i] : id가 i인 svg 요소
      const rendered = [];  // rendered[i] : svgs[i]에 마지막으로 반영한 텍스트

      function createSvg(i) {
        const svg = document.createElementNS(SVG_NS, 'svg');
        svg.id = String(i);
        return svg;
      }

      // i번 svg를 처음 상태(빈 svg)로 되돌린다
      function reset(i) {
        const fresh = createSvg(i);
        svgs[i].replaceWith(fresh);
        svgs[i] = fresh;
      }

      function update() {
        const lines = textarea.value.split('\n');
        for (let i = 0; i < COUNT; i++) {
          const text = i < lines.length ? lines[i] : '';
          if (text === rendered[i]) continue;   // 바뀐 줄만 다시 그린다
          rendered[i] = text;
          if (text === '') {
            reset(i);
            continue;
          }
          try {
            JsBarcode(svgs[i], text, BARCODE_OPTIONS);
          } catch (e) {
            reset(i);   // CODE128로 인코딩할 수 없는 문자가 있는 줄
          }
        }
      }

      // 인쇄 대상 표시를 모두 지운다
      function clearPrinting() {
        for (const el of document.querySelectorAll('.printing')) {
          el.classList.remove('printing');
        }
      }

      // svg 하나만 인쇄한다
      function printSvg(svg) {
        clearPrinting();
        svg.classList.add('printing');
        window.print();
      }

      document.addEventListener('DOMContentLoaded', () => {
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < COUNT; i++) {
          svgs[i] = createSvg(i);
          rendered[i] = '';
          fragment.appendChild(svgs[i]);
        }
        document.body.appendChild(fragment);
        textarea.addEventListener('input', update);

        // svg는 reset()에서 통째로 교체되므로 svg마다 리스너를 달지 않고 body에서 위임받는다
        document.body.addEventListener('click', (e) => {
          const svg = e.target.closest('svg');
          if (svg && svg.hasChildNodes()) printSvg(svg);   // 빈 svg는 무시
        });

        // 인쇄창이 닫히면 표시를 지운다 (Safari 등은 print()가 창이 닫히기 전에 반환될 수 있음)
        window.addEventListener('afterprint', clearPrinting);
      });
    </script>
  </body>
</html>
